info:
  name: Get Verification Status
  type: http
  seq: 2
  tags:
    - api
    - verification

http:
  method: GET
  url: "{{baseUrl}}/api/v1/verifications/:verificationId/status"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: verificationId
      value: "{{verificationId}}"
      type: path

runtime:
  scripts:
    - type: before-request
      code: |-
        const crypto = require("crypto");

        const secret = process.env.API_HMAC_SECRET;
        if (!secret || secret.length < 32) {
          throw new Error("API_HMAC_SECRET must contain at least 32 characters.");
        }

        const timestamp = Math.floor(Date.now() / 1000).toString();
        const nonce = crypto.randomUUID();
        const url = new URL(req.getUrl());
        const requestTarget = `${url.pathname}${url.search}`;
        const bodyHash = crypto.createHash("sha256").update("", "utf8").digest("hex");
        const canonical = `${req.getMethod()}\n${requestTarget}\n${timestamp}\n${nonce}\n${bodyHash}`;
        const signature = crypto.createHmac("sha256", secret).update(canonical, "utf8").digest("hex");

        req.setHeader("X-Timestamp", timestamp);
        req.setHeader("X-Nonce", nonce);
        req.setHeader("X-Signature", signature);
    - type: tests
      code: |-
        test("should return verification status", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().verificationId).to.equal(bru.getVar("verificationId") || bru.getEnvVar("verificationId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Membaca status verifikasi memakai `verificationId` dari runtime variable hasil request create,
  atau fallback dari environment variable bila diisi manual.
