name: CI and Deploy to Render

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B -ntp verify

  container-smoke:
    name: Docker and PostgreSQL smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start the complete stack
        run: docker compose up --build --detach

      - name: Run signed end-to-end smoke test
        run: python3 scripts/smoke_test.py

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: [test, container-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger deployment of the tested commit through Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          separator='?'
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator='&' ;;
          esac
          curl --fail --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${GITHUB_SHA}"

      - name: Explain skipped deployment
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "Deployment skipped because repository secret RENDER_DEPLOY_HOOK_URL is not configured."
